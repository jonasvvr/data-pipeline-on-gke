# Two distinct KSAs, bound via Workload Identity to two distinct GCP service
# accounts with two distinct BigQuery grants (Exercise 01, step 4):
#   - airflow-runner: Airflow's own scheduler/webserver/triggerer pods. Needs
#     no BigQuery access at all -- it only schedules pods and polls their status.
#   - dbt-runner: the per-domain dbt pods Cosmos launches. Needs BigQuery
#     dataEditor on silver+gold and dataViewer on bronze.
# Keeping them separate means a bug in Airflow's own control plane can't touch
# BigQuery, and is what makes "different GCP identity per domain" possible
# later if a domain ever needs narrower access than another.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-runner
  namespace: data-pipeline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbt-runner
  namespace: data-pipeline
